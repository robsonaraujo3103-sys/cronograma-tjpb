# Publica a raiz do repositório no GitHub Pages a cada push em main.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Tenta habilitar o Pages (fonte: GitHub Actions) se ainda estiver desligado.
          # O GITHUB_TOKEN padrão não tem administration:write; na primeira vez o dono
          # do repositório pode precisar definir Source = GitHub Actions em Settings > Pages.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # v3 inclui arquivos ocultos, então .nojekyll entra no site publicado.
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
